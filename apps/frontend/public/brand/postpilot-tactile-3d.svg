<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Outer Soft Shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#80A805" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#5B7803" flood-opacity="0.2"/>
    </filter>
    
    <!-- 3D Bevel Rim Gradient -->
    <linearGradient id="bevel-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4FFA1" />
      <stop offset="35%" stop-color="#C5F52A" />
      <stop offset="100%" stop-color="#8BB80D" />
    </linearGradient>

    <!-- Top Cap Matte Surface Gradient -->
    <linearGradient id="cap-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7FA48" />
      <stop offset="100%" stop-color="#B6E41D" />
    </linearGradient>

    <!-- Recessed Glyph Inner Shadow Filter -->
    <filter id="recessed-inner" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="1.5"/>
      <feGaussianBlur stdDeviation="0.8" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Outer Base Rim -->
  <rect x="3" y="3" width="94" height="94" rx="26" fill="url(#bevel-rim)" filter="url(#soft-shadow)"/>
  
  <!-- Raised Top Cap Key Surface -->
  <rect x="6.5" y="5.5" width="87" height="87" rx="24" fill="url(#cap-surface)"/>
  <rect x="6.5" y="5.5" width="87" height="87" rx="24" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.35"/>
  
  <!-- Deep Recessed Black Amie-Style Glyph -->
  <g fill="#000000" filter="url(#recessed-inner)" transform="translate(0, 0.5)">
    
  <!-- P1 (Left Post) -->
  <path fill-rule="evenodd" d="
    M 16 21
    L 25 21
    C 31 19.5, 39 19, 44 23.5
    C 49 28, 48.5 37, 44 42.5
    C 39.5 47, 32 48.5, 25 48.5
    L 25 79
    L 16 79
    Z
    M 25 28.5
    L 32 28.5
    C 37 28.5, 40 31, 39.5 35
    C 39 39, 36 41.5, 30.5 41.5
    L 25 41.5
    Z
  "/>
  <!-- P2 (Right Pilot) -->
  <path fill-rule="evenodd" d="
    M 53 21
    L 62 21
    C 68 19.5, 76 19, 81 23.5
    C 86 28, 85.5 37, 81 42.5
    C 76.5 47, 69 48.5, 62 48.5
    L 62 79
    L 53 79
    Z
    M 62 28.5
    L 69 28.5
    C 74 28.5, 77 31, 76.5 35
    C 76 39, 73 41.5, 67.5 41.5
    L 62 41.5
    Z
  "/>

  </g>
</svg>