<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- PostPilot Signature Brand Squircle (#C5F52A) -->
  <rect width="100" height="100" rx="26" fill="#C5F52A" />
  
  <!-- Clear Interlocking "PP" Monogram (Continuous Dynamic Contour) -->
  <!-- Left P (x=24) and Right P (x=46) with overlapping bowls -->
  <g fill="none" stroke="#000000" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- P1 (Upper Left Post) -->
    <path d="M 28 80 L 28 20 C 28 16, 52 14, 60 26 C 66 36, 58 48, 42 48 L 28 48" />
    <!-- P2 (Nested Right Pilot) -->
    <path d="M 48 80 L 48 34 C 48 30, 72 28, 80 40 C 86 50, 78 62, 62 62 L 48 62" />
  </g>
</svg>

