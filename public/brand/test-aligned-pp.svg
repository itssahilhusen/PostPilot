<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- PostPilot Signature Lime Background (#C5F52A) -->
  <rect width="100" height="100" rx="26" fill="#C5F52A" />
  
  <!-- Clear Twin "PP" Ribbon - Both P's Crystal Clear -->
  <!-- P1 (Left Post) -->
  <path d="M 26 78 L 26 22 C 26 16, 44 16, 51 25 C 57 32, 53 46, 40 48 L 26 48" 
        fill="none" stroke="#000000" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Fluid connective bridge flowing into P2 -->
  <path d="M 38 48 C 45 48, 49 48, 56 48" 
        fill="none" stroke="#000000" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- P2 (Right Pilot) -->
  <path d="M 56 78 L 56 22 C 56 16, 74 16, 81 25 C 87 32, 83 46, 70 48 L 56 48" 
        fill="none" stroke="#000000" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>

