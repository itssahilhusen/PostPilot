# Development Docker Compose Stack for PostPilot
services:
  reerts-postgres:
    image: postgres:16-alpine
    container_name: reerts-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reerts
    ports:
      - "5432:5432"
    volumes:
      - reerts-pgdata:/var/lib/postgresql/data
    networks:
      - reerts-network

  reerts-redis:
    image: redis:7-alpine
    container_name: reerts-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - reerts-redisdata:/data
    networks:
      - reerts-network

  reerts-redisinsight:
    image: redis/redisinsight:latest
    container_name: reerts-redisinsight
    restart: always
    ports:
      - "5540:5540"
    depends_on:
      - reerts-redis
    networks:
      - reerts-network

volumes:
  reerts-pgdata:
  reerts-redisdata:

networks:
  reerts-network:
    driver: bridge
